   name: Bug report
   description: Something is broken
   labels: ["type: bug"]
   body:
     - type: textarea
       id: what-happened
       attributes:
         label: What happened?
         description: Describe the problem
       validations:
         required: true
     - type: textarea
       id: steps
       attributes:
         label: Steps to reproduce
         placeholder: "1. Go to...\n2. Click..."
     - type: textarea
       id: expected
       attributes:
         label: Expected result
     - type: dropdown
       id: priority
       attributes:
         label: Severity
         options: [Low, Medium, High, Critical]
